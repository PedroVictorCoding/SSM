[package]
name = "sail"
version = "0.1.0"
edition = "2024"

[lib]
name = "sail"
path = "src/lib.rs"

[features]
# Exactly one backend is selected at compile time (priority: cuda > wgpu > ndarray).
default = ["ndarray"]
ndarray = ["burn/ndarray"]
wgpu = ["burn/wgpu", "burn/fusion", "burn/autotune"]
# Diagnostic alternative: bypass the Fusion wrapper while retaining WGPU kernels.
wgpu-unfused = ["wgpu"]
cuda = ["burn/cuda-jit", "burn/fusion"]

[dependencies]
burn = { version = "0.16", features = ["train", "autodiff"] }
cubecl-runtime = { version = "0.4", features = ["channel-mpsc", "std"] }
cubecl = { version = "0.4", default-features = false, features = ["std"] }
memmap2 = "0.9"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
cpal = "0.16"
hound = "3.5"
libc = "0.2"

[profile.release]
debug = false
opt-level = 3

# Keep dependencies optimised even in debug builds; tensor code is unusably slow otherwise.
[profile.dev.package."*"]
opt-level = 3
